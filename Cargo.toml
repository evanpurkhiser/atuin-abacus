[package]
name = "atuin-abacus"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[dependencies]
anyhow = "1.0"
atuin-client = { version = "=18.24.6", default-features = false, features = ["sync"] }
atuin-common = { version = "=18.24.6", features = ["ai", "sqlite"] }
atuin-domain = "=18.24.6"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
iana-time-zone = "0.1"
palette = "0.7"
sentry = { version = "0.49.5", default-features = false, features = ["contexts", "panic", "ureq", "native-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
time = "0.3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
