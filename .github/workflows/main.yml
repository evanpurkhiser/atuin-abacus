name: build
on: [push]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.2.0

      - run: prek run --all-files

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    name: Build
    needs: test-and-lint

    permissions:
      packages: write

    uses: evanpurkhiser/workflows/.github/workflows/docker.yml@main # zizmor: ignore[unpinned-uses]
    with:
      publish: ${{ github.ref == 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: evanpurkhiser/workflows/.github/workflows/deploy-image-personal.yml@main # zizmor: ignore[unpinned-uses]
    with:
      digest: ${{ needs.build.outputs.digest }}
