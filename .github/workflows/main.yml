name: build
on: [push]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: atuin_test
          POSTGRES_PASSWORD: atuin_test
          POSTGRES_DB: atuin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - run: deno install --frozen

      - run: prek run --all-files

      - name: Run tests
        run: deno task test
        env:
          DATABASE_URL: postgresql://atuin_test:atuin_test@localhost:5432/atuin_test
          TZ: UTC

  deploy:
    name: Deploy
    needs: test-and-lint

    permissions:
      packages: write

    uses: evanpurkhiser/workflows/.github/workflows/docker.yml@main # zizmor: ignore[unpinned-uses]
    with:
      publish: ${{ github.ref == 'refs/heads/main' }}
